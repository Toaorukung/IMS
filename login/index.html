<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ – ระบบขายสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

  <div class="login-page">
    <!-- Back to home -->
    <a href="../home"
      style="position:fixed;top:20px;left:20px;color:rgba(255,255,255,0.6);font-size:.9rem;text-decoration:none;transition:color .2s;"
      onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">
      <i class="fas fa-arrow-left me-1"></i><span data-i18n="back_home">กลับหน้าหลัก</span>
    </a>

    <div class="login-card">
      <!-- Lang toggle -->
      <div class="text-end mb-2">
        <button type="button" class="btn btn-sm btn-outline-secondary"
          onclick="I18n.setLang(I18n.getLang()==='th'?'en':'th')" style="font-size:.8rem;padding:2px 10px;">
          🌐 <span id="lang-toggle-label"></span>
        </button>
      </div>
      <!-- Logo -->
      <img src="/assets/img/logo.png" alt="โลโก้" class="login-logo">
      <div class="login-title" data-i18n="login_title">ระบบขายสินค้าและจัดการคลังสินค้า (Inventory Management System)
      </div>
      <div class="login-sub" data-i18n="login_sub">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</div>

      <!-- Alert -->
      <div id="login-alert" class="alert alert-danger d-none align-items-center gap-2 py-2 px-3 mb-3" role="alert"
        style="border-radius:10px;font-size:.9rem;">
        <i class="fas fa-exclamation-circle"></i>
        <span id="login-alert-msg"></span>
      </div>

      <!-- Form -->
      <form id="login-form" onsubmit="return false;">
        <div class="mb-3">
          <label for="username" class="form-label" data-i18n="lbl_username">ชื่อผู้ใช้</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"
              style="border-radius:10px 0 0 10px;border:1.5px solid #e2e8f0;">
              <i class="fas fa-user text-muted"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="username" data-i18n-placeholder="ph_username"
              placeholder="กรอกชื่อผู้ใช้"
              style="border-radius:0 10px 10px 0;border:1.5px solid #e2e8f0;border-left:none;" autocomplete="username">
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label" data-i18n="lbl_password">รหัสผ่าน</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"
              style="border-radius:10px 0 0 10px;border:1.5px solid #e2e8f0;">
              <i class="fas fa-lock text-muted"></i>
            </span>
            <input type="password" class="form-control border-start-0 border-end-0" id="password"
              data-i18n-placeholder="ph_password" placeholder="กรอกรหัสผ่าน"
              style="border:1.5px solid #e2e8f0;border-left:none;border-right:none;" autocomplete="current-password">
            <button type="button" class="input-group-text bg-light" id="toggle-password"
              style="border-radius:0 10px 10px 0;border:1.5px solid #e2e8f0;cursor:pointer;">
              <i class="fas fa-eye text-muted" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btn-login">
          <span id="btn-login-text"><i class="fas fa-sign-in-alt me-2"></i><span
              data-i18n="btn_login">เข้าสู่ระบบ</span></span>
          <span id="btn-login-spinner" class="d-none">
            <span class="spinner-border spinner-border-sm me-2"></span>กำลังตรวจสอบ...
          </span>
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script>
    $(document).ready(function () {
      // If already logged in → go to dashboard (role determined by server on array page load)
      if (Auth.isLoggedIn()) { window.location.replace('../dashboard/home/'); return; }

      // Apply i18n
      if (typeof I18n !== 'undefined') {
        I18n.apply();
        document.getElementById('lang-toggle-label').textContent = I18n.getLang() === 'th' ? 'EN' : 'ภาษาไทย';
      }

      // Toggle password visibility
      $('#toggle-password').on('click', function () {
        const inp = $('#password');
        const isPass = inp.attr('type') === 'password';
        inp.attr('type', isPass ? 'text' : 'password');
        $('#eye-icon').toggleClass('fa-eye fa-eye-slash');
      });

      // Focus first field
      $('#username').focus();

      // Enter key
      $('#username, #password').on('keypress', function (e) {
        if (e.which === 13) doLogin();
      });

      // Submit
      $('#login-form').on('submit', doLogin);
      $('#btn-login').on('click', doLogin);
    });

    async function doLogin() {
      const username = $('#username').val().trim();
      const password = $('#password').val();
      if (!username || !password) {
        showAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
        return;
      }

      setLoading(true);
      try {
        const res = await API.login(username, password);
        if (res.success) {
          Auth.save(res.token, res.user);
          // Redirect ตาม role: admin → home, staff → withdrawal
          const dest = res.user.role === 'admin' ? '/dashboard/home/' : '/dashboard/withdrawal/';
          $('#login-alert').removeClass('alert-danger d-none').addClass('alert-success')
            .html('<i class="fas fa-check-circle me-2"></i>เข้าสู่ระบบสำเร็จ! กำลังนำทาง...');
          setTimeout(() => { window.location.replace(dest); }, 800);
        } else {
          showAlert(res.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
          setLoading(false);
        }
      } catch (e) {
        showAlert('ไม่สามารถเชื่อมต่อระบบได้ กรุณาตรวจสอบ GAS_URL ใน config.js');
        setLoading(false);
      }
    }

    function showAlert(msg) {
      $('#login-alert').removeClass('d-none alert-success').addClass('alert-danger')
        .removeClass('d-none').show();
      $('#login-alert-msg').text(msg);
    }

    function setLoading(on) {
      $('#btn-login').prop('disabled', on);
      $('#btn-login-text').toggleClass('d-none', on);
      $('#btn-login-spinner').toggleClass('d-none', !on);
    }
  </script>
</body>

</html>
