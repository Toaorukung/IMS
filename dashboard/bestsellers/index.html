<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สินค้าขายดี – ระบบขายสินค้าและจัดการคลังสินค้า</title>
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="bestsellers">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title" data-i18n="page_bestsellers">สินค้าขายดี</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger" data-i18n="btn_logout"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
    <div class="section-header mb-3">
      <div class="section-header-title" data-i18n="page_bestsellers"><i class="fas fa-trophy me-2 text-warning"></i>สินค้าขายดี</div>
    </div>

    <!-- ตัวเลือกช่วงเวลา -->
    <div class="panel mb-4">
      <div class="panel-body">
        <div class="d-flex flex-wrap gap-3 align-items-end">
          <div>
            <label class="form-label d-block" data-i18n="bs_period">ช่วงเวลา</label>
            <div class="btn-group" role="group" id="bs-mode-group">
              <button type="button" class="btn btn-outline-primary active" data-mode="day"   data-i18n="bs_day">รายวัน</button>
              <button type="button" class="btn btn-outline-primary"        data-mode="month" data-i18n="bs_month">รายเดือน</button>
              <button type="button" class="btn btn-outline-primary"        data-mode="year"  data-i18n="bs_year">รายปี</button>
            </div>
          </div>
          <div id="bs-input-day">
            <label class="form-label" data-i18n="bs_pick_date">เลือกวัน</label>
            <input type="date" id="bs-date" class="form-control">
          </div>
          <div id="bs-input-month" style="display:none">
            <label class="form-label" data-i18n="bs_pick_month">เลือกเดือน</label>
            <input type="month" id="bs-month" class="form-control">
          </div>
          <div id="bs-input-year" style="display:none">
            <label class="form-label" data-i18n="bs_pick_year">เลือกปี (ค.ศ.)</label>
            <input type="number" id="bs-year" class="form-control" min="2020" max="2099">
          </div>
          <div>
            <label class="form-label d-block" data-i18n="th_category">หมวดหมู่</label>
            <select id="bs-cat-filter" class="form-select" style="min-width:180px;"></select>
          </div>
        </div>
      </div>
    </div>

    <!-- สรุป -->
    <div class="row g-3 mb-4" id="bs-stats" style="display:none">
      <div class="col-6 col-md-4"><div class="stat-card"><div class="stat-icon blue"><i class="fas fa-cubes"></i></div><div class="stat-value" id="bs-stat-products">-</div><div class="stat-label" data-i18n="bs_stat_products">ชนิดสินค้าที่ขาย</div></div></div>
      <div class="col-6 col-md-4"><div class="stat-card"><div class="stat-icon green"><i class="fas fa-layer-group"></i></div><div class="stat-value" id="bs-stat-qty">-</div><div class="stat-label" data-i18n="bs_stat_qty">จำนวนที่ขายรวม</div></div></div>
      <div class="col-12 col-md-4"><div class="stat-card"><div class="stat-icon teal"><i class="fas fa-wallet"></i></div><div class="stat-value small" id="bs-stat-value">-</div><div class="stat-label" data-i18n="bs_stat_value">มูลค่าขายรวม</div></div></div>
    </div>

    <!-- บล็อกสินค้าขายดี (เรียงจากซ้าย→ขวา ขายดีก่อน) -->
    <div id="bs-grid" class="bs-grid"></div>
  </div><!-- end .page-body -->
</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
</body>
</html>
