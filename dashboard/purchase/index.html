<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า – ระบบเบิกสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="purchase">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title">สั่งซื้อสินค้า</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
  <div class="section-header mb-3">
    <button class="btn btn-primary" onclick="openPurchaseModal()"><i class="fas fa-plus me-1"></i>สร้างรายการสั่งซื้อ</button>
  </div>
  <div class="filter-tabs">
    <div class="filter-tab active purchase-filter" data-filter="all">ทั้งหมด</div>
    <div class="filter-tab purchase-filter" data-filter="pending">รอดำเนินการ</div>
    <div class="filter-tab purchase-filter" data-filter="in-transit">กำลังขนส่ง</div>
    <div class="filter-tab purchase-filter" data-filter="received">รับแล้ว</div>
  </div>
  <div class="panel">
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th>รหัส</th><th>วันที่</th><th>ซัพพลายเออร์</th><th class="text-center">รายการ</th><th class="text-end">ราคาหยวน</th><th class="text-end">ต้นทุนรวม</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
        <tbody id="purchase-table-body">
          <tr><td colspan="8" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<!-- MODAL: สร้างรายการสั่งซื้อ -->
<div class="modal fade" id="modalPurchase" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalPurchaseLabel"><i class="fas fa-shopping-cart me-2"></i>สร้างรายการสั่งซื้อ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="po-form">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">ซัพพลายเออร์ <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="po-supplier" placeholder="ชื่อบริษัท/ร้าน">
            </div>
            <div class="col-md-4">
              <label class="form-label">วันที่สั่งซื้อ <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="po-order-date">
            </div>
            <div class="col-md-2">
              <label class="form-label">อัตราแลกเปลี่ยน (¥→฿) <span class="text-danger">*</span></label>
              <div class="input-group">
                <input type="number" class="form-control" id="po-exchange-rate" step="0.0001" placeholder="เช่น 4.90">
                <button type="button" class="btn btn-outline-secondary" id="btn-refresh-rate" onclick="fetchLiveRate()" title="ดึงอัตราล่าสุด">
                  <i class="fas fa-sync-alt"></i>
                </button>
              </div>
              <div class="form-text" id="rate-hint"></div>
            </div>
            <div class="col-md-2">
              <label class="form-label">ค่า Freight (฿)</label>
              <input type="number" class="form-control" id="po-freight" value="0" min="0">
            </div>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-2">
            <label class="form-label mb-0 fw-semibold">รายการสินค้า</label>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addPoItem()"><i class="fas fa-plus me-1"></i>เพิ่มสินค้า</button>
          </div>
          <div id="po-items-container"></div>
          <div class="cost-summary mt-3">
            <div class="cost-row"><span>ราคาสินค้ารวม (¥)</span><span id="po-total-yuan">¥0.00</span></div>
            <div class="cost-row"><span>ราคาสินค้า (฿) = ¥ × อัตราแลกเปลี่ยน</span><span id="po-base-thb">฿0.00</span></div>
            <div class="cost-row"><span>ค่า Freight</span><span>-</span></div>
            <div class="cost-row total"><span>ต้นทุนเบื้องต้นรวม (฿)</span><span id="po-total-thb">฿0.00</span></div>
          </div>
          <div class="mt-3">
            <label class="form-label">หมายเหตุ</label>
            <textarea class="form-control" id="po-notes" rows="2" placeholder="หมายเหตุเพิ่มเติม..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="btn-save-po" onclick="savePurchaseOrder()"><i class="fas fa-save me-1"></i>บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: ดูรายละเอียด Import -->
<div class="modal fade" id="modalViewImport" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-eye me-2"></i>รายละเอียดการสั่งซื้อ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="view-import-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type="date"]').forEach(el => { if (!el.value) el.value = today; });
  document.addEventListener('show.bs.modal', function () {
    const t = new Date().toISOString().split('T')[0];
    document.querySelectorAll('input[type="date"]').forEach(el => { if (!el.value) el.value = t; });
  });
});
</script>
</body>
</html>
