<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เบิกสินค้า – ระบบเบิกสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231d54a8' rx='20'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>📦</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="withdrawal">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title" data-i18n="page_withdrawal">เบิกสินค้า</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger" data-i18n="btn_logout"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
  <div class="section-header mb-3">
    <div class="section-header-title"><i class="fas fa-file-export me-2 text-primary"></i><span data-i18n="page_withdrawal">เบิกสินค้า</span></div>
    <button class="btn btn-primary" data-i18n="btn_new_wd" onclick="openWithdrawalModal()"><i class="fas fa-plus me-1"></i>สร้างใบเบิก</button>
  </div>
  <div class="filter-tabs">
    <div class="filter-tab active wd-filter" data-filter="all" data-i18n="filter_all">ทั้งหมด</div>
    <div class="filter-tab wd-filter" data-filter="pending" data-i18n="filter_pending">รอดำเนินการ</div>
    <div class="filter-tab wd-filter" data-filter="completed" data-i18n="filter_completed">เสร็จสิ้น</div>
    <div class="filter-tab wd-filter" data-filter="partial_returned" data-i18n="filter_partial_returned">คืนบางส่วน</div>
    <div class="filter-tab wd-filter" data-filter="returned" data-i18n="filter_returned">คืนแล้ว</div>
  </div>
  <div class="panel">
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th data-i18n="th_id">รหัส</th><th data-i18n="th_date">วันที่</th><th data-i18n="th_recipient">ผู้รับ</th><th data-i18n="th_dept">แผนก</th><th class="text-center" data-i18n="th_items">รายการ</th><th data-i18n="th_status">สถานะ</th><th class="col-branch" data-i18n="th_branch">สาขา</th><th data-i18n="th_manage">จัดการ</th></tr></thead>
        <tbody id="wd-table-body">
          <tr><td colspan="7" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  </div><!-- end .page-body -->
</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<!-- MODAL: สร้างใบเบิก -->
<div class="modal fade" id="modalWithdrawal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="modal_wd_title"><i class="fas fa-file-export me-2"></i>สร้างใบเบิกสินค้า</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="wd-form">
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label">ผู้รับสินค้า <span class="text-danger">*</span></label>
              <select class="form-select" id="wd-recipient"><option value="">-- เลือกผู้รับ --</option></select>
            </div>
            <div class="col-md-3">
              <label class="form-label">แผนก</label>
              <input type="text" class="form-control" id="wd-department" placeholder="แผนก">
            </div>
            <div class="col-md-2">
              <label class="form-label">วันที่เบิก <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="wd-date">
            </div>
            <div class="col-md-3">
              <label class="form-label">ประเภท</label>
              <select class="form-select" id="wd-type">
                <option value="normal">เบิกสินค้าออก</option>
                <option value="return">คืนสินค้าเข้าสต็อค</option>
              </select>
            </div>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-2">
            <label class="form-label mb-0 fw-semibold">รายการสินค้า</label>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addWdItem()"><i class="fas fa-plus me-1"></i>เพิ่มรายการ</button>
          </div>
          <div id="wd-items-container"></div>
          <div class="d-flex justify-content-end mt-3">
            <div class="cost-summary" style="min-width:280px;">
              <div class="cost-row total"><span>มูลค่ารวม</span><span id="wd-total-value">฿0.00</span></div>
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label">หมายเหตุ</label>
            <textarea class="form-control" id="wd-notes" rows="2" placeholder="หมายเหตุ..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="btn_cancel">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="btn-save-wd" data-i18n="btn_save" onclick="saveWithdrawal()"><i class="fas fa-save me-1"></i>บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: คืนสินค้า (Partial Return) -->
<div class="modal fade" id="modalReturn" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="modal_return_title"><i class="fas fa-undo me-2"></i>คืนสินค้า</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="return-wd-id">
        <div class="alert alert-info d-flex align-items-center mb-3">
          <i class="fas fa-info-circle me-2 fs-5"></i>
          <div>อ้างอิง: <strong id="return-wd-ref">-</strong></div>
        </div>
        <p class="text-muted small mb-3">
          <i class="fas fa-check-square me-1"></i>
          ทำเครื่องหมายถูกที่รายการ และระบุจำนวนที่ต้องการคืน (ไม่จำเป็นต้องคืนทั้งหมด)
        </p>
        <div id="return-items-container"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="btn_cancel">ยกเลิก</button>
        <button type="button" class="btn btn-warning" id="btn-submit-return" onclick="submitReturn()">
          <i class="fas fa-undo me-1"></i><span data-i18n="btn_confirm_return">ยืนยันคืนสินค้า</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: ดูรายละเอียดใบเบิก -->
<div class="modal fade" id="modalViewWd" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="modal_view_wd_title"><i class="fas fa-file-invoice me-2"></i>รายละเอียดใบเบิก</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="view-wd-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" id="btn-print-receipt"><i class="fas fa-print me-1"></i><span data-i18n="btn_print">พิมพ์ใบเบิก</span></button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="btn_close">ปิด</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type="date"]').forEach(el => { if (!el.value) el.value = today; });
  document.addEventListener('show.bs.modal', function () {
    const t = new Date().toISOString().split('T')[0];
    document.querySelectorAll('input[type="date"]').forEach(el => { if (!el.value) el.value = t; });
  });
});
</script>
</body>
</html>
