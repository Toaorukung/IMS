<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สรุปการขายรายสินค้า – ระบบขายสินค้าและจัดการคลังสินค้า</title>
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../../assets/css/style.css">
</head>
<body data-page="withdrawal-items">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <a href="/dashboard/withdrawal/" class="btn btn-sm btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i><span data-i18n="btn_back_withdrawal">กลับหน้าขาย</span>
      </a>
      <div class="topbar-title" id="topbar-title" data-i18n="nav_withdrawal_items">สรุปการขายรายสินค้า</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger" data-i18n="btn_logout">
        <i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ
      </button>
    </div>
  </div>

  <div class="page-body">
    <div class="section-header mb-3">
      <div class="section-header-title">
        <i class="fas fa-clipboard-list me-2 text-primary"></i>
        <span data-i18n="nav_withdrawal_items">สรุปการขายรายสินค้า</span>
      </div>
    </div>

    <!-- ตัวเลือกช่วงเวลา -->
    <div class="panel mb-3">
      <div class="d-flex flex-wrap align-items-end gap-3">
        <div>
          <label class="form-label small mb-1 d-block">ช่วงเวลา</label>
          <div class="btn-group" role="group" id="wdi-mode-group">
            <button type="button" class="btn btn-outline-primary active" data-mode="day"   onclick="wdiSetMode('day')">รายวัน</button>
            <button type="button" class="btn btn-outline-primary"        data-mode="month" onclick="wdiSetMode('month')">รายเดือน</button>
            <button type="button" class="btn btn-outline-primary"        data-mode="year"  onclick="wdiSetMode('year')">รายปี</button>
          </div>
        </div>
        <div id="wdi-pick-day">
          <label class="form-label small mb-1 d-block">เลือกวัน</label>
          <input type="date" id="wdi-date" class="form-control" onchange="renderWithdrawalItems()">
        </div>
        <div id="wdi-pick-month" style="display:none">
          <label class="form-label small mb-1 d-block">เลือกเดือน</label>
          <input type="month" id="wdi-month" class="form-control" onchange="renderWithdrawalItems()">
        </div>
        <div id="wdi-pick-year" style="display:none">
          <label class="form-label small mb-1 d-block">เลือกปี</label>
          <input type="number" id="wdi-year" class="form-control" min="2000" max="2100" step="1" style="width:120px" onchange="renderWithdrawalItems()">
        </div>
        <div id="wdi-branch-wrap" style="display:none">
          <label class="form-label small mb-1 d-block">สาขา</label>
          <select id="wdi-branch" class="form-select" onchange="renderWithdrawalItems()" style="min-width:200px"></select>
        </div>
        <div class="ms-auto">
          <button class="btn btn-outline-primary" onclick="loadWithdrawalItems()" title="รีเฟรช"><i class="fas fa-sync-alt"></i></button>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon blue"><i class="fas fa-cubes"></i></div>
          <div class="stat-value" id="wdi-stat-items">-</div>
          <div class="stat-label">จำนวนรายการสินค้า</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon teal"><i class="fas fa-layer-group"></i></div>
          <div class="stat-value" id="wdi-stat-qty">-</div>
          <div class="stat-label">จำนวนขายรวม (ชิ้น)</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-icon green"><i class="fas fa-wallet"></i></div>
          <div class="stat-value small" id="wdi-stat-value">-</div>
          <div class="stat-label">มูลค่าขายรวม</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <i class="fas fa-list me-2"></i>รายการสินค้าที่ขายออก
          <span class="text-muted fw-normal fs-6 ms-2" id="wdi-period-label"></span>
        </div>
        <input type="text" id="wdi-search" class="form-control form-control-sm" placeholder="ค้นหาสินค้า..." style="width:220px;">
      </div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th style="width:48px" class="text-center">#</th>
              <th>รหัส</th>
              <th>ชื่อสินค้า</th>
              <th class="text-center">หน่วย</th>
              <th class="text-end">จำนวนขาย</th>
              <th class="text-center">จำนวนครั้ง</th>
              <th class="text-end">มูลค่ารวม</th>
            </tr>
          </thead>
          <tbody id="wdi-table-body">
            <tr><td colspan="7" class="text-center text-muted py-5">
              <div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังโหลด...
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../../assets/js/config.js"></script>
<script src="../../../assets/js/i18n.js"></script>
<script src="../../../assets/js/api.js"></script>
<script src="../../../assets/js/layout.js"></script>
<script src="../../../assets/js/app.js"></script>
</body>
</html>
