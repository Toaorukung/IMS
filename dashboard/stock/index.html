<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สต็อคสินค้า – ระบบเบิกสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231d54a8' rx='20'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>📦</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="stock">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title" data-i18n="page_stock">สต็อคสินค้า</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger" data-i18n="btn_logout"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
  <div class="section-header mb-3">
    <div class="section-header-title" data-i18n="page_stock"><i class="fas fa-warehouse me-2 text-primary"></i>สต็อคสินค้า</div>
  </div>
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fas fa-cubes"></i></div>
        <div class="stat-value" id="stock-stat-total">-</div>
        <div class="stat-label" data-i18n="stat_total_items">รายการสินค้าทั้งหมด</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-icon red"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="stat-value text-danger" id="stock-stat-low">-</div>
        <div class="stat-label" data-i18n="stat_low_stock">สต็อคต่ำกว่าขั้นต่ำ</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="stat-card">
        <div class="stat-icon teal"><i class="fas fa-wallet"></i></div>
        <div class="stat-value small" id="stock-stat-value">-</div>
        <div class="stat-label" data-i18n="stat_stock_val">มูลค่าสต็อคทั้งหมด</div>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" data-i18n="stock_list_title">รายการสต็อค</div>
      <div class="d-flex gap-2">
        <select id="stock-branch-filter" class="form-select form-select-sm" style="width:220px; display:none;"></select>
        <input type="text" id="stock-search" class="form-control form-control-sm" data-i18n-placeholder="ph_search_stock" placeholder="ค้นหาสินค้า..." style="width:220px;">
        <button class="btn btn-sm btn-outline-primary" onclick="loadStock()"><i class="fas fa-sync-alt"></i></button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th data-i18n="th_id">รหัส</th><th data-i18n="th_product_name">ชื่อสินค้า</th><th class="text-center" data-i18n="th_qty">คงเหลือ</th><th class="text-center" data-i18n="th_unit">หน่วย</th><th class="text-end" data-i18n="th_cost_per">ต้นทุน/ชิ้น</th><th class="text-end" data-i18n="th_total_val">มูลค่ารวม</th><th data-i18n="th_status">สถานะ</th><th class="col-branch" data-i18n="th_branch">สาขา</th><th></th></tr></thead>
        <tbody id="stock-table-body">
          <tr><td colspan="7" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>  <script src="../../assets/js/i18n.js"></script><script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
</body>
</html>
