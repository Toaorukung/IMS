<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โยกของข้ามโกดัง – ระบบเบิกสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231d54a8' rx='20'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>📦</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="transfer">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title" data-i18n="page_transfer">โยกของข้ามโกดัง</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger" data-i18n="btn_logout"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
  <div class="section-header mb-3">
    <div class="section-header-title"><i class="fas fa-dolly me-2 text-primary"></i><span data-i18n="page_transfer">โยกของข้ามโกดัง</span></div>
    <button class="btn btn-primary" onclick="openTransferModal()"><i class="fas fa-plus me-1"></i>โยกของ</button>
  </div>
  <div class="panel">
    <div class="table-responsive">
      <table class="table">
        <thead><tr>
          <th>รหัส</th><th>วันที่</th><th>สินค้า</th>
          <th class="text-center">จำนวน</th><th>จาก → ไป</th>
          <th class="text-end">ต้นทุน/หน่วย (ปลายทาง)</th>
          <th class="text-end">ค่าขนส่ง+แรง</th><th>โดย</th>
        </tr></thead>
        <tbody id="tf-table-body">
          <tr><td colspan="8" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  </div><!-- end .page-body -->
</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<!-- MODAL: โยกของข้ามโกดัง -->
<div class="modal fade" id="modalTransfer" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-dolly me-2"></i>โยกของข้ามโกดัง</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="tf-form">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">ย้ายจากสาขา (ต้นทาง) <span class="text-danger">*</span></label>
              <select class="form-select" id="tf-from" onchange="onTransferFromChange()"><option value="">-- เลือกสาขาต้นทาง --</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">ย้ายไปสาขา (ปลายทาง) <span class="text-danger">*</span></label>
              <select class="form-select" id="tf-to"><option value="">-- เลือกสาขาปลายทาง --</option></select>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-7">
              <label class="form-label">ของที่จะย้าย <span class="text-danger">*</span></label>
              <select class="form-select" id="tf-product" onchange="onTransferProductChange()"><option value="">-- เลือกสาขาต้นทางก่อน --</option></select>
              <div class="form-text" id="tf-avail">&nbsp;</div>
            </div>
            <div class="col-md-2">
              <label class="form-label">วันที่</label>
              <input type="date" class="form-control" id="tf-date">
            </div>
            <div class="col-md-3">
              <label class="form-label">จำนวนที่ย้าย <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="tf-qty" min="0" step="any" value="0" oninput="calcTransferPreview()">
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">ค่าขนส่ง (฿)</label>
              <input type="number" class="form-control" id="tf-transport" min="0" step="any" value="0" oninput="calcTransferPreview()">
            </div>
            <div class="col-md-4">
              <label class="form-label">ค่ายกแรงงาน (฿)</label>
              <input type="number" class="form-control" id="tf-labor" min="0" step="any" value="0" oninput="calcTransferPreview()">
            </div>
            <div class="col-md-4">
              <label class="form-label">หมายเหตุ</label>
              <input type="text" class="form-control" id="tf-notes" placeholder="หมายเหตุ...">
            </div>
          </div>
          <div class="alert alert-info mb-0 d-flex justify-content-between align-items-center">
            <span><i class="fas fa-calculator me-2"></i>ต้นทุน/หน่วยที่สาขาปลายทาง โดยประมาณ (รวมค่าขนส่ง+แรง)</span>
            <strong id="tf-dest-cost">฿0.00</strong>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="btn_cancel">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="btn-save-tf" onclick="saveTransfer()"><i class="fas fa-dolly me-1"></i>ยืนยันโยกของ</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const today = new Date().toISOString().split('T')[0];
  document.querySelectorAll('input[type="date"]').forEach(el => { if (!el.value) el.value = today; });
});
</script>
</body>
</html>
