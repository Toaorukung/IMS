<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการหมวดหมู่ – ระบบขายสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="icon" href="/assets/img/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="categories">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title" data-i18n="page_categories">จัดการหมวดหมู่</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger" data-i18n="btn_logout"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
  <div class="section-header mb-3">
    <div class="section-header-title" data-i18n="page_categories"><i class="fas fa-layer-group me-2 text-primary"></i>จัดการหมวดหมู่</div>
    <button class="btn btn-primary" data-i18n="btn_add_category" onclick="openAddCategory()"><i class="fas fa-plus me-1"></i>เพิ่มหมวดหมู่</button>
  </div>
  <div class="panel">
    <div class="table-responsive">
      <table class="table">
        <thead><tr><th data-i18n="th_category">หมวดหมู่</th><th data-i18n="th_description">รายละเอียด</th><th class="text-center" data-i18n="th_product_count">จำนวนสินค้า</th><th data-i18n="th_manage">จัดการ</th></tr></thead>
        <tbody id="categories-table-body">
          <tr><td colspan="4" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>กำลังโหลด...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  </div><!-- end .page-body -->
</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<!-- MODAL: เพิ่ม/แก้ไขหมวดหมู่ -->
<div class="modal fade" id="modalCategory" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalCategoryLabel" data-i18n="modal_category_title"><i class="fas fa-layer-group me-2"></i>เพิ่มหมวดหมู่</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="category-form">
          <div class="mb-3">
            <label class="form-label" data-i18n="lbl_category_name">ชื่อหมวดหมู่ <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="cat-name" placeholder="เช่น เครื่องเขียน, อุปกรณ์ไฟฟ้า">
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="th_description">รายละเอียด</label>
            <textarea class="form-control" id="cat-desc" rows="2"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="btn_cancel">ยกเลิก</button>
        <button type="button" class="btn btn-primary" id="btn-save-cat" data-i18n="btn_save" onclick="saveCategory()"><i class="fas fa-save me-1"></i>บันทึก</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>  <script src="../../assets/js/i18n.js"></script><script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
</body>
</html>
