<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานประจำเดือน – ระบบเบิกสินค้าและจัดการคลังสินค้า (Inventory Management System)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body data-page="report">
<div id="wrapper">

<nav id="sidebar"></nav>

<div id="main-content">
  <div id="topbar">
    <div class="d-flex align-items-center gap-3">
      <button id="sidebar-toggle" class="btn btn-sm btn-outline-secondary d-lg-none"><i class="fas fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title">รายงานประจำเดือน</div>
    </div>
    <div class="topbar-actions">
      <a href="/dashboard/home/" class="btn btn-sm btn-outline-secondary" title="หน้าหลัก"><i class="fas fa-home"></i></a>
      <button id="btn-logout" class="btn btn-sm btn-outline-danger"><i class="fas fa-sign-out-alt me-1"></i>ออกจากระบบ</button>
    </div>
  </div>

  <div class="page-body">
  <div class="section-header mb-3">
    <div class="section-header-title"><i class="fas fa-chart-bar me-2 text-primary"></i>รายงานประจำเดือน</div>
  </div>
  <div class="panel mb-4">
    <div class="panel-body">
      <div class="row g-3 align-items-end">
        <div class="col-sm-3">
          <label class="form-label">เดือน</label>
          <select class="form-select" id="rpt-month">
            <option value="1">มกราคม</option><option value="2">กุมภาพันธ์</option>
            <option value="3">มีนาคม</option><option value="4">เมษายน</option>
            <option value="5">พฤษภาคม</option><option value="6">มิถุนายน</option>
            <option value="7">กรกฎาคม</option><option value="8">สิงหาคม</option>
            <option value="9">กันยายน</option><option value="10">ตุลาคม</option>
            <option value="11">พฤศจิกายน</option><option value="12">ธันวาคม</option>
          </select>
        </div>
        <div class="col-sm-3">
          <label class="form-label">ปี (ค.ศ.)</label>
          <input type="number" class="form-control" id="rpt-year" value="2025" min="2020" max="2099">
        </div>
        <div class="col-sm-3">
          <button class="btn btn-primary" id="btn-gen-report" onclick="generateReport()">
            <i class="fas fa-search me-1"></i>สร้างรายงาน
          </button>
        </div>
        <div class="col-sm-3 text-sm-end">
          <button class="btn btn-success" onclick="exportToExcel()">
            <i class="fas fa-file-csv me-1"></i>ส่งออก CSV/Excel
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="rpt-placeholder" class="text-center py-5 text-muted">
    <i class="fas fa-chart-bar fa-3x mb-3 opacity-25"></i>
    <p>เลือกเดือนและปี แล้วกด <strong>สร้างรายงาน</strong></p>
  </div>

  <div id="rpt-data" style="display:none;">
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon blue"><i class="fas fa-ship"></i></div><div class="stat-value" id="rpt-stat-imports">-</div><div class="stat-label">รายการสั่งซื้อ</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon red"><i class="fas fa-coins"></i></div><div class="stat-value small" id="rpt-stat-import-cost">-</div><div class="stat-label">ต้นทุนนำเข้ารวม</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon green"><i class="fas fa-file-export"></i></div><div class="stat-value" id="rpt-stat-withdrawals">-</div><div class="stat-label">ใบเบิกที่เสร็จสิ้น</div></div></div>
      <div class="col-6 col-md-3"><div class="stat-card"><div class="stat-icon teal"><i class="fas fa-wallet"></i></div><div class="stat-value small" id="rpt-stat-stock-value">-</div><div class="stat-label">มูลค่าสต็อคปัจจุบัน</div></div></div>
    </div>
    <div class="panel mb-4">
      <div class="panel-header"><div class="panel-title"><i class="fas fa-ship me-2"></i>รายการสั่งซื้อ/นำเข้า</div></div>
      <div class="table-responsive">
        <table class="table">
          <thead><tr><th>รหัส</th><th>วันที่</th><th>ซัพพลายเออร์</th><th class="text-end">ราคาหยวน</th><th class="text-end">ค่า Freight</th><th class="text-end">ต้นทุนรวม</th><th>สถานะ</th></tr></thead>
          <tbody id="rpt-imports-body"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header"><div class="panel-title"><i class="fas fa-file-export me-2"></i>รายการเบิกจ่าย (เสร็จสิ้น)</div></div>
      <div class="table-responsive">
        <table class="table">
          <thead><tr><th>รหัส</th><th>วันที่</th><th>ผู้รับ</th><th>แผนก</th><th class="text-end">มูลค่า</th><th>สถานะ</th></tr></thead>
          <tbody id="rpt-wd-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  </div><!-- end .page-body -->
</div><!-- end #main-content -->
</div><!-- end #wrapper -->

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/config.js"></script>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/layout.js"></script>
<script src="../../assets/js/app.js"></script>
</body>
</html>
